# Publishes the exact tarball prepared from a stable GitHub release tag.
# Authentication is npm trusted-publisher OIDC only; no token fallback exists.

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Fetch the protected release branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Configure approved release signers
        shell: bash
        run: |
          if [[ -z "${RELEASE_ALLOWED_SIGNERS}" ]]; then
            echo "::error::RELEASE_ALLOWED_SIGNERS must contain the reviewed SSH allowed-signers entries"
            exit 1
          fi
          allowed_signers="${RUNNER_TEMP}/release-allowed-signers"
          umask 077
          printf '%s\n' "${RELEASE_ALLOWED_SIGNERS}" > "${allowed_signers}"
          git config --local gpg.format ssh
          git config --local gpg.ssh.allowedSignersFile "${allowed_signers}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      # Installed from a tarball checked against a committed hash, so the
      # bootstrap is pinned by bytes rather than by registry metadata. Every
      # other install in this job is already covered by pnpm-lock.yaml.
      - name: Use the reviewed npm release
        shell: bash
        env:
          NPM_VERSION: 11.18.0
          NPM_TARBALL_SHA256: 73f6155215ebabf4ed96dca1f567c2372cc713c33af2e5b9b62fde4e92373e2e
        run: |
          tarball="${RUNNER_TEMP}/npm-${NPM_VERSION}.tgz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz" \
            --output "${tarball}"
          echo "${NPM_TARBALL_SHA256}  ${tarball}" | sha256sum --check --strict --quiet
          npm install --global "${tarball}"
          installed="$(npm --version)"
          if [[ "${installed}" != "${NPM_VERSION}" ]]; then
            echo "::error::npm ${installed} is active but ${NPM_VERSION} was reviewed"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Check types
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Run synthetic protocol composition
        run: pnpm example

      - name: Check package artifacts
        run: pnpm run release:check

      - name: Prepare and verify the release tarball
        run: pnpm run release:pack -- -- --require-clean --require-main-ancestor --require-release-tag --expected-release-commit "${RELEASE_COMMIT}" --output .release

      - name: Upload the prepared release
        id: upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: agent-access-release-${{ github.run_id }}
          path: .release/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 30

      - name: Record the prepared artifact digest
        run: echo "Prepared artifact SHA-256 ${{ steps.upload.outputs.artifact-digest }}" >> "${GITHUB_STEP_SUMMARY}"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_COMMIT: ${{ github.sha }}

    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Set up Node.js and the npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the prepared release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-access-release-${{ github.run_id }}
          path: .release

      - name: Publish the verified prepared tarball
        run: node scripts/release-packages.mjs publish --expected-release-commit "${RELEASE_COMMIT}" --manifest .release/package-manifest.json
